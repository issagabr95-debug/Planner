<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منظّم الطالب</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6366f1">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="منظّم الطالب">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1d2433;--mu:#6b7488;--pr:#4f46e5;--ok:#16a34a;--bad:#dc2626;--bd:#e3e7f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#1a2132;--tx:#e8ecf5;--mu:#97a1b8;--pr:#818cf8;--bd:#2a3348}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;padding-bottom:84px}
header{padding:18px 16px 8px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}
.pts{background:var(--pr);color:#fff;border-radius:20px;padding:4px 12px;font-size:14px}
main{padding:8px 16px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,button{font:inherit;color:var(--tx)}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin-bottom:8px}
.row{display:flex;gap:8px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;width:100%}
.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.item .t{flex:1}.item small{color:var(--mu);display:block}
.item.done .t b{text-decoration:line-through;color:var(--mu)}
.late small{color:var(--bad)}
.x{background:none;border:0;color:var(--bad);font-size:18px;cursor:pointer}
input[type=checkbox]{width:22px;height:22px;margin:0}
.empty{color:var(--mu);text-align:center;padding:14px}
.timer{font-size:56px;text-align:center;font-weight:700;margin:10px 0;font-variant-numeric:tabular-nums}
.mode{text-align:center;color:var(--mu);margin-bottom:6px}
.big{font-size:30px;font-weight:700;color:var(--pr)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:10px 0;font-size:12px;color:var(--mu);cursor:pointer}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--pr);font-weight:700}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);cursor:pointer}.seg button.on{background:var(--pr);color:#fff}
.hr{display:flex;gap:10px;border-bottom:1px solid var(--bd);min-height:40px;padding:6px 0}.hr>span{width:44px;color:var(--mu);font-size:13px}.hr>div{flex:1}.hr.now{background:rgba(79,70,229,.12);border-radius:8px}.hr .item{border:0;padding:2px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chips button{padding:6px 12px;border:1px solid var(--bd);border-radius:16px;background:var(--bg);color:var(--tx);cursor:pointer}.chips button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
header{background:linear-gradient(135deg,#6366f1,#8b5cf6 60%,#ec4899);color:#fff;border-radius:0 0 28px 28px;padding:24px 18px 28px;margin-bottom:12px;box-shadow:0 8px 24px rgba(99,102,241,.35)}
h1{font-size:22px;color:#fff}.pts{background:rgba(255,255,255,.25);font-weight:700}
body{padding-bottom:104px}
.card{border:0;border-radius:18px;box-shadow:0 4px 16px rgba(30,40,80,.1)}
.btn{background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 4px 12px rgba(99,102,241,.35);font-weight:700;border-radius:12px}
.btn.g{background:var(--card);color:var(--tx);box-shadow:0 2px 8px rgba(30,40,80,.1)}
input:focus,select:focus{outline:2px solid var(--pr);border-color:transparent}
input[type=checkbox]{accent-color:#16a34a}
.chips button{border-radius:20px;padding:8px 13px;font-size:14px}.chips button.on{background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 3px 10px rgba(99,102,241,.4)}
#hl>b{display:block;margin:12px 0 2px;color:var(--pr)}
.timer{font-size:68px;background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.big{font-size:34px}
.alert{background:rgba(245,158,11,.16);border:1px solid rgba(245,158,11,.45);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:14px;line-height:1.8}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:22px;border:0;padding-bottom:0;box-shadow:0 8px 28px rgba(30,40,80,.25);overflow:hidden}
nav button.on span{transform:scale(1.25)}nav button span{transition:transform .15s}
.tab{display:none}.tab.on{display:block}
</style>
</head>
<body>
<header><h1>📚 منظّم الطالب</h1><div class="pts">⭐ <span id="pts">0</span></div></header>
<main>
<section class="tab on" id="t-hw">
 <div id="al"></div>
 <button class="btn g" id="bell" onclick="enableNotif()" style="margin-bottom:12px">🔔 تفعيل التنبيهات</button>
 <div class="card">
  <div id="chips" class="chips"></div>
  <input id="hs" type="hidden">
  <input id="ht" placeholder="الواجب">
  <input id="hd" type="date">
  <button class="btn" onclick="addHw()">＋ إضافة واجب</button>
  <div id="hm" class="empty" style="padding:8px 0 0"></div>
 </div>
 <div class="card" id="hl"></div>
</section>
<section class="tab" id="t-sc">
 <div class="seg"><button id="vd" class="on" onclick="setView('day')">اليوم بالساعات</button><button id="vw" onclick="setView('week')">الأسبوع</button></div>
 <div class="card">
  <select id="sd"></select>
  <input id="ss" placeholder="المادة / النشاط">
  <input id="st" type="time" value="16:00">
  <button class="btn" onclick="addSc()">＋ إضافة للجدول</button>
 </div>
 <div class="card" id="sl"></div>
</section>
<section class="tab" id="t-tm">
 <div class="card">
  <div class="mode" id="mode">وقت المذاكرة</div>
  <div class="timer" id="tm">25:00</div>
  <div class="row"><button class="btn" id="go" onclick="toggleT()">ابدأ</button><button class="btn g" onclick="resetT()">إعادة</button></div>
  <p class="mode">٢٥ دقيقة مذاكرة ثم ٥ دقائق راحة. كل جلسة = ٥ نقاط</p>
 </div>
</section>
<section class="tab" id="t-pg">
 <div class="card stats">
  <div><div class="big" id="s1">0</div>واجبات منجزة</div>
  <div><div class="big" id="s2">0</div>جلسات مذاكرة</div>
 </div>
 <div class="card"><b>نسبة إنجاز الواجبات</b> <span id="pc">0%</span><div class="bar"><i id="pb" style="width:0"></i></div></div>
 <div class="card"><b>مستواك:</b> <span id="lv"></span></div>
 <button class="btn g" onclick="resetAll()">مسح كل البيانات</button>
</section>
</main>
<nav>
 <button class="on" onclick="tab('hw',this)"><span>📝</span>الواجبات</button>
 <button onclick="tab('sc',this)"><span>🗓️</span>الجدول</button>
 <button onclick="tab('tm',this)"><span>⏱️</span>المؤقت</button>
 <button onclick="tab('pg',this)"><span>🏆</span>تقدمي</button>
</nav>
<script>
var KEY='studentPlanner1',D=['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
var DS=['لغة عربية','لغة إنجليزية','رياضيات','علوم عامة','فيزياء','كيمياء','أحياء','دراسات اجتماعية','واجبات أخرى'];
var EM=['📖','🔤','➗','🔬','⚡','🧪','🧬','🌍','📌'];
var S={hw:[],sc:[],pom:0,pts:0,subs:DS.slice()},view='day';
function setView(v){view=v;$('vd').classList.toggle('on',v==='day');$('vw').classList.toggle('on',v==='week');render()}
try{var r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
$('sd').innerHTML=D.map(function(d,i){return '<option value="'+i+'">'+d+'</option>'}).join('');
function tab(n,b){document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on')});$('t-'+n).classList.add('on');document.querySelectorAll('nav button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');render()}
function addHw(){try{var t=$('ht').value.trim(),s=$('hs').value.trim(),m=$('hm');if(!s){m.style.color='var(--bad)';m.textContent='اختر المادة أولًا';return}if(!t){m.style.color='var(--bad)';m.textContent='اكتب اسم الواجب أولًا';return}S.hw.push({id:Date.now(),s:s,t:t||s,d:$('hd').value,done:false});$('ht').value='';$('hs').value='';m.style.color='var(--ok)';m.textContent='✓ تمت الإضافة، يمكنك إضافة واجب آخر';save();render()}catch(e){$('hm').textContent='حدث خطأ: '+e.message}}
$('ht').addEventListener('keydown',function(e){if(e.key==='Enter')addHw()});
function renderChips(){var v=$('hs').value.trim();$('chips').innerHTML=DS.map(function(n,i){return '<button class="'+(n===v?'on':'')+'" onclick="pick('+i+')">'+EM[i]+' '+esc(n)+'</button>'}).join('')}
function pick(i){var n=DS[i];$('hs').value=($('hs').value.trim()===n)?'':n;renderChips();$('ht').focus()}
$('hs').addEventListener('input',renderChips);
function togHw(id){var h=S.hw.find(function(x){return x.id===id});h.done=!h.done;S.pts+=h.done?10:-10;if(S.pts<0)S.pts=0;save();render()}
function delHw(id){S.hw=S.hw.filter(function(x){return x.id!==id});save();render()}
function addSc(){var s=$('ss').value.trim();if(!s)return;S.sc.push({id:Date.now(),day:+$('sd').value,time:$('st').value,s:s});$('ss').value='';save();render()}
function delSc(id){S.sc=S.sc.filter(function(x){return x.id!==id});save();render()}
function render(){renderChips();checkDue();
 $('pts').textContent=S.pts;
 var h=S.hw.slice().sort(function(a,b){return (a.s||'~').localeCompare(b.s||'~')||a.done-b.done||(a.d||'9').localeCompare(b.d||'9')});
 var ps=null;$('hl').innerHTML=h.length?h.map(function(x){var hd='';if(x.s!==ps){ps=x.s;hd='<b>'+esc(x.s||'بدون مادة')+'</b>'}var late=!x.done&&x.d&&x.d<today();
  return hd+'<div class="item'+(x.done?' done':'')+(late?' late':'')+'"><input type="checkbox" '+(x.done?'checked':'')+' onchange="togHw('+x.id+')"><div class="t"><b>'+esc(x.t)+'</b><small>'+esc(x.s)+(x.d?' · التسليم: '+x.d:'')+(late?' · متأخر!':'')+'</small></div><button class="x" onclick="delHw('+x.id+')">✕</button></div>'}).join(''):'<div class="empty">لا توجد واجبات. أضف أول واجب 👆</div>';
 var o='';D.forEach(function(d,i){var l=S.sc.filter(function(x){return x.day===i}).sort(function(a,b){return a.time.localeCompare(b.time)});
  if(l.length)o+='<b>'+d+'</b>'+l.map(function(x){return '<div class="item"><div class="t">'+esc(x.s)+'<small>'+x.time+'</small></div><button class="x" onclick="delSc('+x.id+')">✕</button></div>'}).join('')});
 if(view==='day'){var ti=(new Date().getDay()+1)%7,nh=new Date().getHours(),q='<b>اليوم: '+D[ti]+'</b>';
  for(var h=6;h<=23;h++){var l=S.sc.filter(function(x){return x.day===ti&&Math.min(23,Math.max(6,parseInt(x.time)))===h}).sort(function(a,b){return a.time.localeCompare(b.time)});
   q+='<div class="hr'+(h===nh?' now':'')+'"><span>'+(h%12||12)+(h<12?' ص':' م')+'</span><div>'+l.map(function(x){return '<div class="item"><div class="t">'+esc(x.s)+'<small>'+x.time+'</small></div><button class="x" onclick="delSc('+x.id+')">✕</button></div>'}).join('')+'</div></div>'}
  $('sl').innerHTML=q}else{$('sl').innerHTML=o||'<div class="empty">الجدول فارغ</div>'}
 var dn=S.hw.filter(function(x){return x.done}).length,p=S.hw.length?Math.round(dn/S.hw.length*100):0;
 $('s1').textContent=dn;$('s2').textContent=S.pom;$('pc').textContent=p+'%';$('pb').style.width=p+'%';
 $('lv').textContent=S.pts>=300?'🥇 بطل':S.pts>=100?'🥈 مجتهد':'🥉 مبتدئ';
}
var mode='study',left=1500,iv=null,endAt=0;
function fmt(){$('tm').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}
function toggleT(){if(iv){clearInterval(iv);iv=null;$('go').textContent='استمر';return}
 endAt=Date.now()+left*1000;$('go').textContent='إيقاف مؤقت';
 iv=setInterval(function(){left=Math.max(0,Math.round((endAt-Date.now())/1000));fmt();if(left<=0)finish()},500)}
function finish(){clearInterval(iv);iv=null;try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}notif(mode==='study'?'انتهت جلسة المذاكرة 🎉 خذ راحة':'انتهت الراحة، هيا نذاكر 📚','');
 if(mode==='study'){S.pom++;S.pts+=5;save();mode='break';left=300;$('mode').textContent='وقت الراحة ☕'}else{mode='study';left=1500;$('mode').textContent='وقت المذاكرة'}
 $('go').textContent='ابدأ';fmt();render()}
function resetT(){clearInterval(iv);iv=null;mode='study';left=1500;$('mode').textContent='وقت المذاكرة';$('go').textContent='ابدأ';fmt()}
function resetAll(){if(confirm('هل تريد مسح كل البيانات؟')){S={hw:[],sc:[],pom:0,pts:0};save();render()}}
$('sd').value=(new Date().getDay()+1)%7;
function notif(t,b){try{if(window.Notification&&Notification.permission==='granted')new Notification(t,{body:b})}catch(e){}}
function enableNotif(){try{if(!window.Notification){$('bell').textContent='التنبيهات تظهر داخل التطبيق فقط';return}Notification.requestPermission().then(function(p){$('bell').textContent=p==='granted'?'🔔 التنبيهات مفعّلة':'🔕 غير مفعّلة (التنبيهات تظهر داخل التطبيق)';checkDue()})}catch(e){$('bell').textContent='التنبيهات تظهر داخل التطبيق فقط'}}
function dstr(n){var d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function checkDue(){var t=dstr(0),tm=dstr(1),l=0,a=0,b=0,m=[];S.hw.forEach(function(x){if(x.done||!x.d)return;if(x.d<t)l++;else if(x.d===t)a++;else if(x.d===tm)b++});
 if(l)m.push('🔴 '+l+' واجب متأخر');if(a)m.push('🟠 '+a+' واجب يُسلَّم اليوم');if(b)m.push('🟡 '+b+' واجب يُسلَّم غدًا');
 $('al').innerHTML=m.length?'<div class="alert">'+m.join('<br>')+'</div>':'';
 var k=t+m.join();if(m.length&&S.nk!==k){S.nk=k;save();notif('منظّم الطالب',m.join(' · '))}}
try{if(window.Notification&&Notification.permission==='granted')$('bell').textContent='🔔 التنبيهات مفعّلة'}catch(e){}
setInterval(function(){checkDue();var n=new Date(),ti=(n.getDay()+1)%7,c=n.getHours()*60+n.getMinutes();S.sc.forEach(function(x){if(x.day!==ti||!x.time)return;var p=x.time.split(':');if(+p[0]*60+ +p[1]-c===10)notif('⏰ بعد 10 دقائق',x.s)})},60000);
render();
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
</script>
</body>
</html>
